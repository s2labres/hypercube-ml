[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercube-ml"
version = "1.0.0"
authors = [
  { name="Dr Mario D'Onghia", email="m.donghia@ucl.ac.uk" },
]
description = "An implemention of the rolling time evaluations of malware classifiers through the Average Area Under Time and the STAS sampling algorithm."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonlines", "matplotlib", "numpy", "pandas",
                "tensorflow[and-cuda]", "tqdm", "dtw-python", "scipy",
                "android-malware-detectors @ git+ssh://git@github.com/s2labres/android_malware_detectors.git@main#egg=android_malware_detectors"]

[tool.setuptools]
packages = ["hypercube", "hypercube.stas", "hypercube.temporal_luck", "experiments"]
